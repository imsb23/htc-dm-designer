      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f8fafc;

      }
      
      .animate-fade-in { animation: fadeIn 0.2s ease-out; }
      .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; opacity: 0; transform: translateY(8px); }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
      
      .flat-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }

      .flat-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        transition: all 0.2s ease;
      }
      
      .flat-card:hover {
        border-color: #cbd5e1;
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
      }

      .editor-scroll-container {
        scrollbar-width: thin;
        scrollbar-color: #94a3b8 #e2e8f0;
      }
      .editor-scroll-container::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .editor-scroll-container::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 8px;
      }
      .editor-scroll-container::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 8px;
        border: 2px solid #e2e8f0;
      }
      .editor-scroll-container::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      button { transition: all 0.2s ease; }
      button:active { transform: scale(0.98); }
      
      input, select, textarea {
        transition: all 0.2s ease;
      }

      .canvas-container svg {
        cursor: crosshair;
      }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
